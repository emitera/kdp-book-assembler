name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 05:00 UTC every 2 days (Supabase free tier pauses after 7 days of inactivity)
    - cron: '0 5 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keepalive:
    name: Supabase DB Keep-Alive Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Keep-Alive Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-keepalive.js
